<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>零售 AI 助手 - 基金推荐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: #F7F8FA;
        }
        .chat-container {
            max-width: 600px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #fff;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .ai-bubble {
            background: #F2F3F5;
            border-radius: 0 16px 16px 16px;
        }
        .user-bubble {
            background: #007AFF;
            color: white;
            border-radius: 16px 16px 0 16px;
        }
        .product-card {
            border: 1px solid #E5E7EB;
            transition: all 0.2s;
        }
        .product-card:active {
            transform: scale(0.98);
            background-color: #F9FAFB;
        }
        .table-container {
            border: 1px solid #EDEDED;
            border-radius: 12px;
            overflow: hidden;
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        .drawer-overlay {
            background: rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s;
        }
        .drawer-content {
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .drawer-open .drawer-content {
            transform: translateY(0);
        }
        .filter-tag {
            border: 1px solid #E5E7EB;
            color: #6B7280;
            transition: all 0.2s;
        }
        .filter-tag.active {
            background: #EFF6FF;
            border-color: #3B82F6;
            color: #3B82F6;
            font-weight: 600;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #root:empty::before {
            content: "页面加载中，请稍候... (如果长时间未显示，请检查网络连接是否正常)";
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
                .then((regs) => Promise.all(regs.map((r) => r.unregister().catch(() => false))))
                .then(() => (window.caches ? caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k)))) : null))
                .catch(() => {});
        }

        // 封装 Lucide 图标组件，解决 React removeChild 报错问题
        const Icon = ({ name, className = "w-4 h-4", ...props }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    lucide.createIcons({
                        attrs: { class: className },
                        nameAttr: 'data-lucide',
                        icons: lucide.icons
                    });
                }
            }, [name, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center shrink-0" {...props}></span>;
        };

        const App = () => {
            const params = new URLSearchParams(window.location.search);
            const initialTab = params.get('tab') || 'qa';
            const [activeTab, setActiveTab] = useState(initialTab); // 'qa', 'customer', 'solution'
            const [currentPage, setCurrentPage] = useState(1);
            const [isFilterOpen, setIsFilterOpen] = useState(false);
            const [tempFilters, setTempFilters] = useState({});
            const [appliedFilters, setAppliedFilters] = useState({});
            const [isHistoryOpen, setIsHistoryOpen] = useState(false);
            const [showAskMenu, setShowAskMenu] = useState(false);
            const [fundPickerSelected, setFundPickerSelected] = useState([]);
            const [fundPickerSearch, setFundPickerSearch] = useState('');
            const [fundPickerShowAll, setFundPickerShowAll] = useState(false);
            const [qaExtraMessages, setQaExtraMessages] = useState([]);

            const fundCatalog = useMemo(() => ([
                {
                    id: '015841',
                    name: '永赢科技智选混合A',
                    type: '混合基金',
                    minBuy: '1元起购',
                    risk: 'R4中高风险',
                    yield1y: '+205.66%',
                    summary: '高弹性、科技赛道集中度高，适合激进型投资者',
                    volatility: '28.5%',
                    maxDrawdown: '-22.4%',
                    strategy: '主攻TMT及电子半导体，偏成长风格，仓位弹性高。',
                    fee: '管理费1.2%/年；A类通常含申购费（以渠道为准）。',
                    holdings: '前十大持仓集中度高（约55%），偏科技龙头。',
                    manager: '高经理：4年经验，擅长科技赛道选股与轮动。'
                },
                {
                    id: '015842',
                    name: '永赢科技智选混合C',
                    type: '混合基金',
                    minBuy: '1元起购',
                    risk: 'R4中高风险',
                    yield1y: '+203.74%',
                    summary: 'C类费率结构适合中短持有，但波动与回撤偏大',
                    volatility: '28.5%',
                    maxDrawdown: '-22.4%',
                    strategy: '主攻TMT及电子半导体，偏成长风格，仓位弹性高。',
                    fee: '管理费1.2%/年；C类无申购费，短期持有可能有赎回费。',
                    holdings: '前十大持仓集中度高（约55%），偏科技龙头。',
                    manager: '高经理：4年经验，擅长科技赛道选股与轮动。'
                },
                {
                    id: '012455',
                    name: '华商均衡成长混合A',
                    type: '混合基金',
                    minBuy: '1元起购',
                    risk: 'R3中风险',
                    yield1y: '+185.51%',
                    summary: '稳健均衡、分散配置，适合中长期配置型投资者',
                    volatility: '18.2%',
                    maxDrawdown: '-12.8%',
                    strategy: '全行业均衡配置，注重估值安全边际与风险控制。',
                    fee: '管理费1.2%/年；A类通常含申购费（以渠道为准）。',
                    holdings: '持仓分散度较高（约32%），覆盖医药、消费与制造。',
                    manager: '张经理：8年经验，均衡型选手，风控体系成熟。'
                },
                {
                    id: '166005',
                    name: '中欧价值发现A',
                    type: '混合基金',
                    minBuy: '10元起购',
                    risk: 'R3中风险',
                    yield1y: '+15.40%',
                    summary: '偏价值风格，回撤控制较好，适合稳健增值',
                    volatility: '16.8%',
                    maxDrawdown: '-10.6%',
                    strategy: '以价值评估为核心，偏中长期持有，强调估值与盈利质量。',
                    fee: '管理费1.2%/年；A类通常含申购费（以渠道为准）。',
                    holdings: '行业相对均衡，偏消费/制造龙头。',
                    manager: '基金经理：价值风格稳定，换手率相对较低。'
                }
            ]), []);

            const customerPortrait = useMemo(() => ({
                name: '张小凡',
                risk: 'R3',
                age: '26岁',
                liquidity: '高',
                holdings: '现金类资产'
            }), []);

            const [sessions, setSessions] = useState(() => {
                try {
                    const parsed = JSON.parse(localStorage.getItem('qa_sessions') || '[]');
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                } catch (e) {}
                const seed = {
                    id: Date.now(),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    title: '问答示例',
                    messages: [
                        { type: 'user', text: '帮我推荐近一年年化收益率高于20%且适合年轻人的基金' },
                        { type: 'ai', kind: 'fund_recommend' },
                        { type: 'user', text: '查询永赢科技智选混合C与华商均衡成长混合A产品对比的核心对比指标' },
                        { type: 'ai', kind: 'fund_compare', funds: ['015842', '012455'] }
                    ]
                };
                return [seed];
            });
            const [activeSessionId, setActiveSessionId] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('qa_sessions') || '[]');
                    return saved?.[0]?.id ?? null;
                } catch (e) {
                    return null;
                }
            });
            const pageSize = 5;

            const filterConfig = {
                customerLevel: { label: '客户等级', options: ['大众客户1', '大众客户2', '黄金客户', '财富客户', '玉琮客户1', '玉琮客户2'] },
                isAdded: { label: '是否添加', options: ['已添加', '未添加'] },
                riskLevel: { label: '风险等级', options: ['保守型', '稳健型', '平衡型', '成长型', '进取型', '未评级'] },
                ageRange: { label: '年龄段', options: ['(0, 20]', '(20, 35]', '(35, 50]', '(50, 65]', '(65, 100]'] }
            };

            const toggleFilterOption = (category, option) => {
                setTempFilters(prev => ({
                    ...prev,
                    [category]: prev[category] === option ? null : option
                }));
            };

            const applyFilters = () => {
                setAppliedFilters({...tempFilters});
                setIsFilterOpen(false);
            };

            const resetFilters = () => {
                setTempFilters({});
            };

            const hasActiveFilters = Object.values(appliedFilters).some(v => v !== null && v !== undefined);

            const filterSummary = useMemo(() => {
                return Object.entries(appliedFilters)
                    .filter(([_, value]) => value)
                    .map(([key, value]) => `${filterConfig[key].label}=${value}`)
                    .join(' 且 ');
            }, [appliedFilters]);

            // 模拟客户数据
            const customers = [
                { id: 'T9zlxhuPjce...', type: '非企微客户', risk: '风险测评未评级', level: '大众客户1', age: '26岁', avatarColor: 'bg-blue-500' },
                { id: 'w8LHUjAeT...', type: '非企微客户', risk: '平衡型', level: '大众客户1', age: '39岁', avatarColor: 'bg-orange-500' },
                { id: 'nyu3oz8w5...', type: '非企微客户', risk: '风险测评未评级', level: '黄金客户', age: '67岁', avatarColor: 'bg-orange-500' },
                { id: 'rHiTol+E0kV...', type: '非企微客户', risk: '平衡型', level: '大众客户1', age: '66岁', avatarColor: 'bg-blue-500' },
                { id: 'mZ+H9GX9...', type: '非企微客户', risk: '平衡型', level: '大众客户1', age: '48岁', avatarColor: 'bg-blue-500' },
                { id: 'ho9pb2HBle...', type: '非企微客户', risk: '风险测评未评级', level: '大众客户1', age: '56岁', avatarColor: 'bg-orange-500' },
                { id: 'xlMBBqN0g...', type: '非企微客户', risk: '成长型', level: '黄金客户', age: '43岁', avatarColor: 'bg-orange-500' },
                { id: 'ndZxmKUJx...', type: '非企微客户', risk: '风险测评未评级', level: '大众客户1', age: '35岁', avatarColor: 'bg-orange-500' },
                { id: 'QhPdPD5qY...', type: '非企微客户', risk: '保守型', level: '财富客户', age: '32岁', avatarColor: 'bg-orange-500' },
            ];

            // 模拟基金数据
            const allFunds = useMemo(() => {
                return Array.from({ length: 200 }, (_, i) => ({
                    id: `${(100000 + i).toString()}`,
                    name: `中欧成长优选${i + 1}号`,
                    yield: (20 + Math.random() * 15).toFixed(2) + '%',
                    risk: Math.random() > 0.5 ? 'R3 中风险' : 'R4 中高风险',
                    info: '混合型 | 适合追求长期增值用户',
                    matchReason: '基于您近一年收益率>20%且风险承受能力R3及以上的偏好，该产品在同类排名中位居前5%，业绩稳定性强，适合长期持有。'
                }));
            }, []);

            const currentTableData = useMemo(() => {
                return allFunds.slice(0, currentPage * pageSize);
            }, [currentPage, allFunds]);

            useEffect(() => {
                // lucide.createIcons(); // 已由 Icon 组件处理
            }, [activeTab]);

            useEffect(() => {
                try {
                    localStorage.setItem('qa_sessions', JSON.stringify(sessions));
                } catch (e) {}
            }, [sessions]);

            const startNewChat = () => {
                const newSession = {
                    id: Date.now(),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    title: '新对话',
                    messages: []
                };
                setSessions(prev => [newSession, ...prev]);
                setActiveSessionId(newSession.id);
                setIsHistoryOpen(false);
                setQaExtraMessages([]);
            };

            const selectSession = (sessionId) => {
                setActiveSessionId(sessionId);
                setIsHistoryOpen(false);
            };

            const clearHistory = () => {
                setSessions([]);
                setActiveSessionId(null);
                setIsHistoryOpen(false);
                try {
                    localStorage.removeItem('qa_sessions');
                } catch (e) {}
            };

            useEffect(() => {
                if (!activeSessionId && sessions.length > 0) {
                    setActiveSessionId(sessions[0].id);
                }
            }, [activeSessionId, sessions]);

            const getFundById = (id) => fundCatalog.find(f => f.id === id);

            const formatFundLabel = (fund) => `${fund.name}(${fund.id})`;

            const extractRiskLevelNumber = (riskText) => {
                const match = String(riskText || '').match(/R(\d)/);
                const parsed = match ? Number(match[1]) : NaN;
                return Number.isFinite(parsed) ? parsed : 3;
            };

            const getFitForCustomer = (fund) => {
                const customerRisk = extractRiskLevelNumber(customerPortrait.risk);
                const fundRisk = extractRiskLevelNumber(fund?.risk);

                let score = 7.5;
                if (fundRisk - customerRisk >= 2) score = 4.5;
                else if (fundRisk - customerRisk === 1) score = 6.5;
                else if (fundRisk === customerRisk) score = 8.0;
                else score = 8.5;

                const volatilityNumber = Number(String(fund?.volatility || '').replace('%', ''));
                if (customerPortrait.liquidity === '高' && Number.isFinite(volatilityNumber) && volatilityNumber >= 20) {
                    score = Math.max(3.5, score - 1.0);
                }

                const level = score >= 8.0 ? '较高' : score >= 6.0 ? '中等' : '较低';
                const scoreText = `${score.toFixed(1)}/10`;

                const pros = [
                    '收益弹性较强，适合年轻客户以小仓位参与',
                    '策略清晰，便于做“卫星仓”增强'
                ];
                const cons = [
                    '波动与回撤可能偏大，短期体验不稳定',
                    '与客户当前偏好（现金类资产）存在风格差异'
                ];
                const notes = [
                    '建议控制仓位（例如 5%–15%），分批/定投进入',
                    '若近期可能用钱，优先保证流动性与低回撤底仓'
                ];

                return { level, scoreText, pros, cons, notes };
            };

            const appendMessagesToActiveSession = (newMessages) => {
                setSessions(prev => prev.map(s => {
                    if (s.id !== activeSessionId) return s;
                    return { ...s, messages: [...(s.messages || []), ...newMessages] };
                }));
            };

            const closeEmbeddedFundPicker = () => {
                setQaExtraMessages(prev => prev.filter(m => m?.kind !== 'fund_picker_embed'));
            };

            const openFundPicker = () => {
                setShowAskMenu(false);
                setFundPickerSelected([]);
                setFundPickerSearch('');
                setFundPickerShowAll(false);
                setActiveTab('qa');
                setQaExtraMessages(prev => {
                    const cleaned = prev.filter(m => m?.kind !== 'fund_picker_embed');
                    return [
                        ...cleaned,
                        { type: 'user', text: '基金查询' },
                        { type: 'ai', kind: 'fund_picker_embed' }
                    ];
                });
            };

            useEffect(() => {
                if (params.get('openFundPicker') === '1') {
                    openFundPicker();
                }
            }, []);

            const togglePickFund = (fundId) => {
                setFundPickerSelected(prev => {
                    const exists = prev.includes(fundId);
                    if (exists) return prev.filter(id => id !== fundId);
                    if (prev.length >= 2) return prev;
                    return [...prev, fundId];
                });
            };

            const confirmFundPicker = () => {
                if (fundPickerSelected.length === 0) return;

                let ensuredSessionId = activeSessionId;
                if (!ensuredSessionId) {
                    const newSession = {
                        id: Date.now(),
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        title: '新对话',
                        messages: []
                    };
                    setSessions(prev => [newSession, ...prev]);
                    ensuredSessionId = newSession.id;
                    setActiveSessionId(newSession.id);
                }

                const pickedFunds = fundPickerSelected.map(getFundById).filter(Boolean);
                const questionText = pickedFunds.length === 2
                    ? `基金产品查询：结合客户画像对比${formatFundLabel(pickedFunds[0])}与${formatFundLabel(pickedFunds[1])}`
                    : `基金产品查询：结合客户画像查看${formatFundLabel(pickedFunds[0])}的核心指标与匹配建议`;

                const aiMessage = pickedFunds.length === 2
                    ? { type: 'ai', kind: 'fund_compare', funds: pickedFunds.map(f => f.id) }
                    : { type: 'ai', kind: 'fund_single', funds: [pickedFunds[0].id] };

                setSessions(prev => prev.map(s => {
                    if (s.id !== ensuredSessionId) return s;
                    return {
                        ...s,
                        messages: [
                            ...(s.messages || []),
                            { type: 'user', text: questionText },
                            aiMessage
                        ]
                    };
                }));

                setQaExtraMessages(prev => ([
                    ...prev,
                    { type: 'user', text: questionText },
                    aiMessage
                ]));
            };

            const renderAiFundPickerEmbed = () => (
                <div className="ai-bubble px-4 py-4 max-w-[95%] text-sm leading-relaxed text-gray-800 shadow-sm border border-gray-100">
                    <div className="flex items-start justify-between">
                        <div>
                            <div className="text-sm font-bold text-gray-900">基金产品选择</div>
                            <div className="text-[11px] text-gray-400 mt-1">数据截至20260326</div>
                        </div>
                        <button onClick={closeEmbeddedFundPicker} className="text-gray-400">
                            <Icon name="x" className="w-5 h-5" />
                        </button>
                    </div>

                    <div className="mt-4 flex items-center bg-white rounded-2xl px-4 py-2.5 border border-gray-100">
                        <Icon name="search" className="w-4 h-4 text-gray-400 mr-2" />
                        <input
                            value={fundPickerSearch}
                            onChange={(e) => setFundPickerSearch(e.target.value)}
                            placeholder="搜索基金名称或代码"
                            className="flex-1 bg-transparent border-none outline-none text-sm"
                        />
                    </div>

                    <div className="mt-4 overflow-hidden rounded-2xl border border-gray-100 bg-white">
                        {(fundPickerShowAll ? fundCatalog : fundCatalog.slice(0, 3))
                            .filter(f => (f.name + f.id).includes(fundPickerSearch))
                            .map((fund) => {
                                const checked = fundPickerSelected.includes(fund.id);
                                return (
                                    <div
                                        key={fund.id}
                                        onClick={() => togglePickFund(fund.id)}
                                        className="px-4 py-3 border-b border-gray-50 active:bg-gray-50 transition-colors cursor-pointer"
                                    >
                                        <div className="flex items-center justify-between">
                                            <div className="min-w-0">
                                                <div className="text-[14px] font-bold text-gray-900 truncate">{fund.name}</div>
                                                <div className="mt-2 flex items-start">
                                                    <div className="text-red-500 font-bold text-base leading-none">{fund.yield1y}</div>
                                                    <div className="ml-3 text-xs text-gray-400 leading-none mt-1">近一年涨跌幅</div>
                                                </div>
                                            </div>
                                            <div className="flex items-center space-x-4 shrink-0">
                                                <div className="text-right">
                                                    <div className="text-[12px] font-bold text-gray-800">{fund.type}</div>
                                                    <div className="text-[11px] text-gray-400 mt-1">{fund.minBuy} | {fund.risk}</div>
                                                </div>
                                                <div className={`w-6 h-6 rounded-full border flex items-center justify-center ${checked ? 'bg-blue-600 border-blue-600' : 'bg-white border-gray-200'}`}>
                                                    {checked && <Icon name="check" className="w-4 h-4 text-white" />}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}

                        {!fundPickerShowAll && fundCatalog.length > 3 && (
                            <div className="p-4">
                                <button
                                    onClick={() => setFundPickerShowAll(true)}
                                    className="w-full py-2.5 text-sm font-bold text-blue-600 border border-blue-100 rounded-2xl active:bg-blue-50 transition-colors flex items-center justify-center space-x-2"
                                >
                                    <span>查看全部</span>
                                    <Icon name="chevron-right" className="w-4 h-4" />
                                </button>
                            </div>
                        )}
                    </div>

                    {fundPickerSelected.length > 0 && (
                        <div className="mt-4 flex flex-wrap gap-2">
                            {fundPickerSelected.map(id => {
                                const f = getFundById(id);
                                if (!f) return null;
                                return (

                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center justify-between mb-1.5">
                                                    <h4 className="font-bold text-[15px] text-gray-900 truncate">{customer.id}</h4>
                                                    <Icon name="chevron-right" className="w-4 h-4 text-gray-300" />
                                                </div>
                                                <div className="flex flex-wrap gap-1.5">
                                                    <span className="px-1.5 py-0.5 bg-gray-100 text-gray-500 text-[10px] rounded font-medium">{customer.type}</span>
                                                    <span className={`px-1.5 py-0.5 text-[10px] rounded font-medium ${customer.risk.includes('未评级') ? 'bg-red-50 text-red-400' : 'bg-orange-50 text-orange-400'}`}>{customer.risk}</span>
                                                    <span className="px-1.5 py-0.5 bg-gray-100 text-gray-500 text-[10px] rounded font-medium">{customer.level}</span>
                                                    <span className="px-1.5 py-0.5 bg-orange-50 text-orange-400 text-[10px] rounded font-medium">{customer.age}</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'solution' && (
                            <div className="p-8 text-center text-gray-400 text-sm">
                                智能方案模块开发中...
                            </div>
                        )}
                    </div>

                    {/* Floating vConsole */}
                    <div className="absolute bottom-20 right-4 px-3 py-1 bg-green-500 text-white text-[10px] font-bold rounded shadow-lg opacity-80">
                        vConsole
                    </div>

                    {showAskMenu && (
                        <div className="absolute inset-0 z-40 flex items-end animate-fade-in">
                            <div className="absolute inset-0 bg-black/20" onClick={() => setShowAskMenu(false)}></div>
                            <div className="relative w-full bg-white rounded-t-3xl shadow-2xl border-t border-gray-100 p-4">
                                <div className="flex items-center justify-between mb-4 border-b pb-2">
                                    <div className="flex space-x-6">
                                        <span className="text-blue-600 font-bold border-b-2 border-blue-600 pb-1">问产品</span>
                                        <span className="text-gray-400 font-medium">问客户</span>
                                        <span className="text-gray-400 font-medium">问资配</span>
                                    </div>
                                    <button onClick={() => setShowAskMenu(false)} className="text-gray-300 hover:text-gray-500 transition-colors">
                                        <Icon name="x-circle" className="w-5 h-5" />
                                    </button>
                                </div>
                                <div className="flex space-x-3">
                                    <button
                                        onClick={(e) => {
                                            e.preventDefault();
                                            e.stopPropagation();
                                            openFundPicker();
                                        }}
                                        className="flex-1 py-2.5 bg-gray-50 border border-gray-100 rounded-xl text-sm font-bold text-gray-700 active:bg-gray-100 transition-all"
                                    >
                                        基金查询
                                    </button>
                                    <button
                                        onClick={() => setShowAskMenu(false)}
                                        className="flex-1 py-2.5 bg-gray-50 border border-gray-100 rounded-xl text-sm font-bold text-gray-700 active:bg-gray-100 transition-all"
                                    >
                                        基金推荐
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* History Drawer */}
                    <div className={`absolute inset-0 z-50 transition-all duration-300 ${isHistoryOpen ? 'visible pointer-events-auto' : 'invisible pointer-events-none'}`}>
                        <div
                            className={`absolute inset-0 bg-black/40 transition-opacity duration-300 ${isHistoryOpen ? 'opacity-100' : 'opacity-0'}`}
                            onClick={() => setIsHistoryOpen(false)}
                        ></div>
                        <div className={`absolute top-0 bottom-0 left-0 w-[70%] max-w-[280px] bg-white shadow-2xl flex flex-col transition-transform duration-300 transform border-r border-gray-100 ${isHistoryOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                            <div className="p-4 border-b flex items-center justify-between bg-white shrink-0">
                                <div className="flex items-center space-x-2.5">
                                    <div className="w-8 h-8 bg-blue-50 rounded-lg flex items-center justify-center">
                                        <Icon name="history" className="w-5 h-5 text-blue-600" />
                                    </div>
                                    <span className="font-bold text-gray-900">历史会话</span>
                                </div>
                                <button onClick={() => setIsHistoryOpen(false)} className="p-1 text-gray-400 active:scale-90 transition-transform">
                                    <Icon name="x" className="w-5 h-5" />
                                </button>
                            </div>
                            <div className="flex-1 overflow-y-auto py-2 px-3 space-y-2 bg-gray-50/30 hide-scrollbar">
                                {sessions.length === 0 ? (
                                    <div className="flex flex-col items-center justify-center py-20 text-gray-400">
                                        <Icon name="message-square" className="w-8 h-8 mb-2 opacity-20" />
                                        <p className="text-[11px]">暂无历史会话</p>
                                    </div>
                                ) : sessions.map((session) => (
                                    <div
                                        key={session.id}
                                        onClick={() => selectSession(session.id)}
                                        className={`p-3.5 rounded-2xl transition-all cursor-pointer border ${activeSessionId === session.id ? 'bg-blue-600 border-blue-600 shadow-md shadow-blue-100' : 'bg-white border-gray-100 active:bg-gray-50 hover:border-blue-200'}`}
                                    >
                                        <div className={`text-xs font-bold mb-1 ${activeSessionId === session.id ? 'text-white/90' : 'text-gray-400'}`}>
                                            {session.time || ''}
                                        </div>
                                        <div className={`text-sm font-bold leading-tight ${activeSessionId === session.id ? 'text-white' : 'text-gray-900'}`}>
                                            {session.title || '会话'}
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="p-4 border-t bg-white shrink-0">
                                <button
                                    onClick={clearHistory}
                                    className="w-full py-3 flex items-center justify-center space-x-2 text-xs font-bold text-gray-400 hover:text-red-500 active:bg-red-50 active:text-red-600 rounded-xl transition-all"
                                >
                                    <Icon name="trash-2" className="w-4 h-4" />
                                    <span>清空历史</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Filter Drawer */}
                    <div className={`absolute inset-0 z-50 transition-all duration-300 ${isFilterOpen ? 'visible pointer-events-auto' : 'invisible pointer-events-none'}`}>
                        <div 
                            className={`absolute inset-0 bg-black/50 transition-opacity duration-300 ${isFilterOpen ? 'opacity-100' : 'opacity-0'}`}
                            onClick={() => setIsFilterOpen(false)}
                        ></div>
                        <div className={`absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl transition-transform duration-300 transform flex flex-col max-h-[85vh] ${isFilterOpen ? 'translate-y-0' : 'translate-y-full'}`}>
                            {/* Drawer Header */}
                            <div className="flex items-center justify-between p-5 border-b shrink-0">
                                <h2 className="text-lg font-bold text-gray-900">筛选客户</h2>
                                <button onClick={() => setIsFilterOpen(false)} className="text-gray-400">
                                    <Icon name="x" className="w-6 h-6" />
                                </button>
                            </div>

                            {/* Drawer Body */}
                            <div className="flex-1 overflow-y-auto p-5 space-y-8 hide-scrollbar">
                                {Object.entries(filterConfig).map(([key, config]) => (
                                    <div key={key} className="space-y-3">
                                        <h3 className="text-sm font-bold text-gray-900">{config.label}</h3>
                                        <div className="flex flex-wrap gap-2.5">
                                            {config.options.map(option => (
                                                <button
                                                    key={option}
                                                    onClick={() => toggleFilterOption(key, option)}
                                                    className={`px-4 py-2 rounded-xl text-xs filter-tag ${tempFilters[key] === option ? 'active' : ''}`}
                                                >
                                                    {option}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Drawer Footer */}
                            <div className="p-5 border-t flex space-x-4 bg-white shrink-0">
                                <button 
                                    onClick={resetFilters}
                                    className="flex-1 py-3.5 border border-gray-200 rounded-2xl text-sm font-bold text-gray-500 active:bg-gray-50 transition-colors"
                                >
                                    重置
                                </button>
                                <button 
                                    onClick={applyFilters}
                                    className="flex-1 py-3.5 bg-blue-600 rounded-2xl text-sm font-bold text-white shadow-lg shadow-blue-200 active:scale-[0.98] transition-all"
                                >
                                    确定
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
